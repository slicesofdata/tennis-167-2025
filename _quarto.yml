          - text: "Performance by Age"
            href: pages/age_performance.qmd
          - text: "Early Career Performance"
            href: pages/early_career.qmd

      - text: "Performance by Nationality"
        menu:
          - text: "Country Dominance"
            href: pages/leading_country_final.qmd
          - text: "American Performance"
